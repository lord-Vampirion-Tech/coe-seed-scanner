<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>COE Seed Scanner</title>
  <style>
    :root {
      --bg: #050912;
      --bg2: #070d18;
      --panel: #0a111d;
      --panel2: #0c1522;
      --input: #060c15;
      --border: #172538;
      --border2: #20344d;
      --blue: #315d91;
      --blue2: #3f76b3;
      --blue3: #5b8fc9;
      --text: #d6deea;
      --text2: #9aa9bb;
      --muted: #647386;
      --green: #4f8068;
      --red: #86584f;
      --radius: 3px;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0
    }

    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-size: 12px;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      width: 100%;
      height: 100vh;
    }

    .sidebar {
      overflow-y: auto;
      background: #070d17;
      border-right: 1px solid #162337;
      padding: 12px;
      scrollbar-width: thin;
      scrollbar-color: #263c57 transparent;
    }

    .sidebar::-webkit-scrollbar {
      width: 6px
    }

    .sidebar::-webkit-scrollbar-track {
      background: transparent
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #243a54
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
      background: #31516f
    }

    .brand {
      padding: 4px 0 13px 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #172538;
      position: relative;
    }

    .brand:before {
      content: "";
      position: absolute;
      left: 0;
      top: 3px;
      bottom: 13px;
      width: 2px;
      background: #3d6795;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .01em;
      color: #dce5f0;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .08em;
      color: #657589;
      text-transform: uppercase;
    }

    .section {
      margin-bottom: 8px;
      padding: 11px;
      background: #0a111c;
      border: 1px solid #172538;
      border-radius: var(--radius);
    }

    .section:hover {
      border-color: #1d3047
    }

    .section h2 {
      margin: 0 0 9px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .09em;
      color: #aab8c8;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin: 7px 0 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .07em;
      color: #718095;
      text-transform: uppercase;
    }

    input,
    select,
    button {
      width: 100%;
      height: 32px;
      border: 1px solid #1a2a3e;
      border-radius: var(--radius);
      background: var(--input);
      color: var(--text);
      padding: 7px 9px;
      font: inherit;
      font-size: 11px;
      outline: none;
      transition: border-color .15s, background .15s;
    }

    input:hover,
    select:hover {
      border-color: #263c55
    }

    input:focus,
    select:focus {
      border-color: #365f8d;
      background: #08111d;
    }

    input[type=number] {
      font-variant-numeric: tabular-nums
    }

    input[type=range] {
      height: 3px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #1c3048;
      accent-color: #4678ad;
    }

    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 13px;
      height: 13px;
      border: 1px solid #5a82ad;
      border-radius: 50%;
      background: #0c1725;
      cursor: pointer;
    }

    input[type=range]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 1px solid #5a82ad;
      border-radius: 50%;
      background: #0c1725;
      cursor: pointer;
    }

    button {
      cursor: pointer;
      background: #0b1420;
      border-color: #1c2d42;
      color: #9facbb;
      font-weight: 600;
    }

    button:hover {
      background: #0e1a29;
      border-color: #315477;
      color: #d2dce8;
    }

    button:active {
      background: #0a121d
    }

    button.primary {
      background: #203f62;
      border-color: #396a9d;
      color: #e4edf7;
    }

    button.primary:hover {
      background: #294c72;
      border-color: #4b7fb3
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .btnrow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .dimension {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .dimension button {
      height: 30px;
      background: #080f18;
      color: #687789;
    }

    .dimension button.active {
      background: #102039;
      border-color: #416b99;
      color: #c7d8e9;
    }

    .dimension button[data-dim=nether].active {
      background: #241613;
      border-color: #755247;
      color: #d9c4bc;
    }

    .scan-mode {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 9px;
    }

    .scan-mode button {
      height: 29px;
      background: #080f18;
      color: #687789;
    }

    .scan-mode button.active {
      background: #102039;
      border-color: #3b638d;
      color: #c5d6e8;
    }

    .mode-block {
      display: none
    }

    .mode-block.active {
      display: block
    }

    .hint {
      color: #7d8c9e;
      font-size: 10px;
      line-height: 1.55;
    }

    .hint b {
      color: #a9bacd;
      font-weight: 600;
    }

    .info {
      font-size: 10px;
      line-height: 1.55;
    }

    .tiny {
      color: #5f7084;
      font-size: 9px;
      line-height: 1.4;
    }

    .mono {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .vein-list {
      margin-top: 2px
    }

    .vein {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 29px;
      padding: 3px 5px;
      border-bottom: 1px solid #121e2c;
      font-size: 10px;
      cursor: pointer;
      border-radius: 2px;
    }

    .vein:last-child {
      border-bottom: 0
    }

    .vein:hover {
      background: #0d1724
    }

    .vein input {
      width: auto;
      height: auto;
      margin: 0;
      padding: 0;
      accent-color: #4777a9;
    }

    .vein-color {
      width: 21px;
      height: 21px;
      flex: none;
      object-fit: contain;
      image-rendering: pixelated;
      border: 1px solid #27374a;
      border-radius: 2px;
      background: #0a111a;
      box-shadow: none;
    }

    .texture-fallback {
      display: none;
      width: 21px;
      height: 21px;
      flex: none;
      border: 1px solid #27374a;
      border-radius: 2px;
    }

    .vein .name {
      flex: 1;
      font-weight: 500;
      color: #aeb9c7;
    }

    .count {
      min-width: 26px;
      padding: 2px 5px;
      border: 1px solid #1d3046;
      border-radius: 2px;
      background: #0b1521;
      color: #8091a5;
      font-size: 9px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .file-upload {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      padding: 8px;
      border: 1px dashed #24364b;
      border-radius: 3px;
      background: #080f18;
      color: #7c8b9d;
      cursor: pointer;
      text-align: center;
    }

    .file-upload:hover {
      border-color: #3c6086;
      background: #0b1521;
      color: #aebed0;
    }

    .file-upload input[type=file] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-icon {
      font-size: 9px;
      font-weight: 700;
      color: #60758c;
    }

    .file-text {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .file-upload.has-file {
      border-style: solid;
      border-color: #3c654f;
      background: #0b1712;
      color: #a7c6b2;
    }

    .map-source-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .map-source {
      min-width: 0
    }

    .map-source-title {
      margin-bottom: 5px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .07em;
      color: #78889a;
    }

    .map-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #040912;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      background: transparent;
      touch-action: none;
    }

    canvas.dragging {
      cursor: grabbing
    }

    .overlay {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      pointer-events: none;
      z-index: 3;
    }

    .statusbar {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 31px;
      padding: 0 9px;
      border: 1px solid #1c2c40;
      border-radius: 3px;
      background: rgba(5, 10, 17, .94);
      font-size: 9px;
      font-family: "JetBrains Mono", Consolas, monospace;
    }

    .badge {
      padding: 4px 7px;
      border: 1px solid #31537a;
      border-radius: 2px;
      background: #0c1929;
      color: #7fa6d0;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .1em;
    }

    .badge.nether {
      border-color: #704c42;
      background: #1c110f;
      color: #bd8878;
    }

    #statusText {
      color: #7d8b9b
    }

    .tooltip {
      position: absolute;
      z-index: 10;
      pointer-events: none;
      min-width: 220px;
      max-width: 320px;
      padding: 9px 11px;
      border: 1px solid #315477;
      border-radius: 3px;
      background: rgba(5, 10, 17, .97);
      color: #b7c3d1;
      font-size: 10px;
      line-height: 1.5;
      display: none;
      font-family: "JetBrains Mono", Consolas, monospace;
    }

    .tooltip .title {
      margin-bottom: 5px;
      color: #c8d8e8;
      font-size: 10px;
      font-weight: 700;
    }

    .tooltip .muted {
      color: #637487
    }

    .selection {
      padding: 8px 9px;
      border-left: 2px solid #365f8d;
      background: #08121e;
    }

    .selection-title {
      margin-bottom: 5px;
      color: #c4d1df;
      font-size: 10px;
      font-weight: 700;
    }

    .map-source-grid+.grid2 {
      margin-top: 10px
    }

    @media(max-width:800px) {
      .app {
        grid-template-columns: 310px minmax(0, 1fr)
      }

      .sidebar {
        padding: 10px
      }
    }

    @media(max-width:600px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 45vh 55vh;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid #162337;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>COE Seed Scanner</h1>
        <div class="subtitle">Create Ore Excavation · 1.21.1</div>
      </div>

      <div class="section">
        <h2>Управление</h2>
        <div class="hint">
          <b>ЛКМ</b> — перетаскивание карты<br>
          <b>Колесо</b> — масштаб<br>
          <b>ЛКМ по метке</b> — выбрать точку<br>
          <b>Двойной ЛКМ</b> — задать центр
        </div>
      </div>

      <div class="section">
        <h2>Мир</h2>
        <label for="seed">Сид мира</label>
        <input id="seed" type="text" value="4535897356405868181" spellcheck="false">
        <label>Измерение</label>
        <div class="dimension">
          <button data-dim="overworld" class="active">Верхний</button>
          <button data-dim="nether">Нижний</button>
        </div>
      </div>

      <div class="section">
        <h2>Область</h2>
        <div class="scan-mode">
          <button id="modeCenter" class="active">Центр + R</button>
          <button id="modeCorners">ЛВ + ПН</button>
        </div>

        <div id="centerMode" class="mode-block active">
          <div class="grid2">
            <div><label>Центр X</label><input id="centerX" type="number" value="0"></div>
            <div><label>Центр Z</label><input id="centerZ" type="number" value="0"></div>
          </div>
          <label>Радиус (чанки)</label>
          <input id="radius" type="number" min="0" value="128">
        </div>

        <div id="cornersMode" class="mode-block">
          <div class="grid2">
            <div><label>ЛВ X</label><input id="cornerMinX" type="number" value="-128"></div>
            <div><label>ЛВ Z</label><input id="cornerMinZ" type="number" value="-128"></div>
            <div><label>ПН X</label><input id="cornerMaxX" type="number" value="128"></div>
            <div><label>ПН Z</label><input id="cornerMaxZ" type="number" value="128"></div>
          </div>
        </div>

        <div class="btnrow" style="margin-top:10px">
          <button id="scan" class="primary">Сканировать</button>
          <button id="resetView">Сброс вида</button>
        </div>
      </div>

      <div class="section">
        <h2>Карты</h2>
        <div class="map-source-grid">
          <div class="map-source">
            <div class="map-source-title">ВЕРХНИЙ МИР</div>
            <label class="file-upload" id="owUploadLabel">
              <span class="file-icon">PNG</span>
              <span class="file-text" id="owUploadText">Загрузить</span>
              <input id="mapImageInputOW" type="file" accept="image/png">
            </label>
            <div id="mapImageNameOW" class="tiny" style="margin-top:5px">Файл не выбран</div>
          </div>
          <div class="map-source">
            <div class="map-source-title">НИЖНИЙ МИР</div>
            <label class="file-upload" id="netherUploadLabel">
              <span class="file-icon">PNG</span>
              <span class="file-text" id="netherUploadText">Загрузить</span>
              <input id="mapImageInputNether" type="file" accept="image/png">
            </label>
            <div id="mapImageNameNether" class="tiny" style="margin-top:5px">Файл не выбран</div>
          </div>
        </div>

        <div class="grid2" style="margin-top:10px">
          <div><label>Центр X</label><input id="mapCenterX" type="number" value="0"></div>
          <div><label>Центр Z</label><input id="mapCenterZ" type="number" value="0"></div>
        </div>

        <div class="btnrow" style="margin-top:7px">
          <button id="mapUseScanCenter">К центру сканирования</button>
          <button id="mapClearOW">Убрать верхнюю</button>
          <button id="mapClearNether">Убрать нижнюю</button>
        </div>

        <label for="mapOpacity">Прозрачность</label>
        <input id="mapOpacity" type="range" min="0" max="100" value="80">
        <div id="mapOpacityValue" class="tiny" style="margin-top:4px">80%</div>
      </div>

      <div class="section">
        <h2>Жилы</h2>
        <div class="btnrow" style="margin-bottom:8px">
          <button id="allOn">Все</button>
          <button id="allOff">Ничего</button>
        </div>
        <div id="veinList" class="vein-list"></div>
      </div>

      <div class="section">
        <h2>Точка</h2>
        <div id="selectionInfo" class="info hint">Нажми ЛКМ по метке</div>
      </div>

      <div class="section">
        <div class="btnrow">
          <button id="savePng">Сохранить</button>
          <button id="resetAll">Сброс</button>
        </div>
      </div>
    </aside>

    <main class="map-wrap" id="mapWrap">
      <canvas id="canvas"></canvas>
      <div class="overlay">
        <div class="statusbar">
          <span class="badge" id="dimBadge">ВЕРХНИЙ</span>
          <span id="statusText">Готово</span>
        </div>
      </div>
      <div class="tooltip" id="tooltip"></div>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>

</html>
